name: vigilar
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 vigilar.py
        env:
          TOPIC_TRENDY: ${{ secrets.TOPIC_TRENDY }}
      - run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
